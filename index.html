<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор парковки</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="card">
        <h1>Калькулятор парковки</h1>
        <p class="subtitle">Стоит ли брать месячный абонемент?</p>

        <form id="form">
            <label>Ваше имя</label>
            <input type="text" id="name" placeholder="например Алексей" required>

            <label>Цена за 1 час парковки (KZT)</label>
            <input type="number" id="rate" placeholder="например 500" min="0" required>

            <label>Часов в неделю на парковке</label>
            <input type="number" id="hours" placeholder="например 40" min="0" required>

            <label>Цена месячного абонемента (KZT)</label>
            <input type="number" id="pass" placeholder="например 50000" min="0" required>

            <button type="submit">Рассчитать</button>
        </form>

        <div id="result"></div>
    </div>

    <script src="script.js"></script>
</body>

</html>
